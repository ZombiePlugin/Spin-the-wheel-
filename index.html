<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Win or Lose Wheel</title>
<style>
  :root {
    --size: min(80vmin, 500px);
    --speed: 1.2s;
    --pointer-size: 36px;
  }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at center, #0b1225 0%, #060b15 100%);
    color: #e6eef8;
    font-family: system-ui, sans-serif;
  }

  h1 { margin-bottom: 20px; }

  .wheel-area {
    position: relative;
    width: var(--size);
    height: var(--size);
  }

  .wheel {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    position: relative;
    transform: rotate(0deg);
    background: conic-gradient(#00c853 0deg 180deg, #d50000 180deg 360deg);
    box-shadow: 0 8px 40px rgba(2,6,23,0.7), inset 0 6px 16px rgba(255,255,255,0.05);
    overflow: hidden;
  }

  .wheel.spinning {
    animation: spin var(--speed) linear infinite;
  }

  .wheel::after {
    content: "";
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 14%;
    height: 14%;
    background: rgba(10,10,10,0.8);
    border-radius: 50%;
    border: 4px solid rgba(255,255,255,0.1);
  }

  .pointer {
    position: absolute;
    left: 50%;
    top: 10px;
    transform: translateX(-50%);
    width: 0;
    height: 0;
    border-left: var(--pointer-size) solid transparent;
    border-right: var(--pointer-size) solid transparent;
    border-bottom: calc(var(--pointer-size) * 1.15) solid #ffeb3b;
    z-index: 20;
  }

  .seg-label {
    position: absolute;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 900;
    font-size: clamp(24px, 3.5vmin, 32px);
    color: #071021;
    text-transform: uppercase;
    user-select: none;
    pointer-events: none;
    text-shadow: 0 2px 4px rgba(255,255,255,0.4);
  }

  .controls {
    display: flex;
    gap: 10px;
    margin-top: 20px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .controls button, .controls input {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.15);
    color: #e6eef8;
    padding: 8px 12px;
    border-radius: 10px;
    cursor: pointer;
    font-weight: 600;
  }

  @keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
</style>
</head>
<body>
  <h1>Win or Lose</h1>

  <div class="wheel-area">
    <div class="pointer"></div>
    <div id="wheel" class="wheel">
      <div class="seg-label" style="transform: rotate(90deg) translateY(-38%);">WIN</div>
      <div class="seg-label" style="transform: rotate(270deg) translateY(-38%);">LOSE</div>
    </div>
  </div>

  <div class="controls">
    <button id="spinBtn">Spin</button>
    <label>Speed: <input id="speedRange" type="range" min="0.2" max="10" step="0.1" value="1.2"></label>
  </div>

<script>
const wheel = document.getElementById('wheel');
const spinBtn = document.getElementById('spinBtn');
const speedRange = document.getElementById('speedRange');
let spinning = false;

spinBtn.addEventListener('click', () => {
  spinning = !spinning;
  if (spinning) {
    wheel.classList.add('spinning');
    spinBtn.textContent = "Stop";
  } else {
    wheel.classList.remove('spinning');
    spinBtn.textContent = "Spin";
  }
});

speedRange.addEventListener('input', () => {
  document.documentElement.style.setProperty('--speed', speedRange.value + 's');
});
</script>
</body>
</html>
