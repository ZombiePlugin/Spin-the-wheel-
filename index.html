<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Spin the Wheel</title>
<style>
  :root{
    --size: min(84vmin, 620px);
    --speed: 6s;
    --pointer-size: 36px;
    --label-offset: 38%;
  }

  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    background:linear-gradient(180deg,#0f1724,#081123);
    color:#e6eef8;
    font-family:system-ui, sans-serif;
  }

  .wheel-area{
    position:relative;
    width:var(--size);
    height:var(--size);
  }

  .wheel{
    width:100%;
    height:100%;
    border-radius:50%;
    box-shadow:0 8px 40px rgba(2,6,23,0.7), inset 0 6px 16px rgba(255,255,255,0.02);
    position:relative;
    transform:rotate(0deg);
    overflow:hidden;
  }

  .wheel.spinning{
    animation: spin var(--speed) linear infinite;
  }

  .wheel::after{
    content:"";
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    width:14%;
    height:14%;
    background:rgba(10,10,10,0.8);
    border-radius:50%;
    border:4px solid rgba(255,255,255,0.04);
  }

  .pointer{
    position:absolute;
    left:50%;
    top:10px;
    transform:translateX(-50%);
    width:0;
    height:0;
    border-left: var(--pointer-size) solid transparent;
    border-right: var(--pointer-size) solid transparent;
    border-bottom: calc(var(--pointer-size) * 1.15) solid #ff4d4d;
    z-index:20;
  }

  .seg-label{
    position:absolute;
    left:50%;
    top:50%;
    transform-origin:0 0;
    font-weight:600;
    font-size:clamp(10px,1.6vmin,15px);
    color:#071021;
    user-select:none;
    pointer-events:none;
  }

  .tick{
    position:absolute;
    left:50%;
    top:50%;
    width:2px;
    height:50%;
    background:rgba(255,255,255,0.06);
    transform-origin:0 0;
    pointer-events:none;
  }

  .controls{
    display:flex;
    gap:10px;
    margin-top:20px;
    flex-wrap:wrap;
    justify-content:center;
  }

  .controls button, .controls input{
    background:rgba(255,255,255,0.05);
    border:1px solid rgba(255,255,255,0.15);
    color:#e6eef8;
    padding:8px 12px;
    border-radius:10px;
    cursor:pointer;
    font-weight:600;
  }

  @keyframes spin{
    from{ transform: rotate(0deg); }
    to{ transform: rotate(360deg); }
  }
</style>
</head>
<body>
  <h1>Spin the Wheel</h1>
  <div class="wheel-area">
    <div class="pointer"></div>
    <div id="wheel" class="wheel"></div>
  </div>
  <div class="controls">
    <button id="spinBtn">Spin</button>
    <button id="pauseBtn">Pause</button>
    <label>Speed: <input id="speedRange" type="range" min="1" max="20" value="6"></label>
  </div>

<script>
const wheel = document.getElementById('wheel');
const spinBtn = document.getElementById('spinBtn');
const pauseBtn = document.getElementById('pauseBtn');
const speedRange = document.getElementById('speedRange');

let spinning = false;
let speed = 6;

// basic labels & colors
const labels = ["Prize A","Prize B","Prize C","Prize D","Prize E","Prize F"];
const colors = ["#FFD166","#06D6A0","#118AB2","#EF476F","#8E7DFF","#FFB4A2"];

function buildWheel(){
  const segs = labels.length;
  const degPer = 360/segs;
  const gradient = labels.map((_,i)=>`${colors[i%colors.length]} ${i*degPer}deg ${(i+1)*degPer}deg`).join(',');
  wheel.style.background = `conic-gradient(${gradient})`;
  wheel.innerHTML = "";
  for(let i=0;i<segs;i++){
    const tick=document.createElement('div');
    tick.className='tick';
    tick.style.transform=`rotate(${i*degPer}deg) translate(-1px,-50%)`;
    wheel.appendChild(tick);
    const label=document.createElement('div');
    label.className='seg-label';
    label.textContent=labels[i];
    label.style.transform=`rotate(${i*degPer+degPer/2}deg) translate(0,-38%) rotate(${-i*degPer-degPer/2}deg)`;
    wheel.appendChild(label);
  }
}
buildWheel();

spinBtn.addEventListener('click',()=>{
  if(!spinning){
    wheel.classList.add('spinning');
    spinning=true;
    spinBtn.textContent="Stop";
  } else {
    wheel.classList.remove('spinning');
    spinning=false;
    spinBtn.textContent="Spin";
  }
});

pauseBtn.addEventListener('click',()=>{
  if(wheel.style.animationPlayState==="paused"){
    wheel.style.animationPlayState="running";
    pauseBtn.textContent="Pause";
  } else {
    wheel.style.animationPlayState="paused";
    pauseBtn.textContent="Resume";
  }
});

speedRange.addEventListener('input',()=>{
  speed = speedRange.value;
  document.documentElement.style.setProperty('--speed', speed + 's');
});
</script>
</body>
</html>
